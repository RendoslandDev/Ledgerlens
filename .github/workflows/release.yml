# Builds the desktop installers when a version tag (v1.2.3) is pushed, and attaches them to a draft
# GitHub Release. macOS builds are signed when the Apple secrets are set (see docs/deploy.md);
# Windows and Linux builds are not signed. CI (ci.yml) smoke-tests the Windows and Linux installers.
name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Pinned so a new stable release (and its new clippy lints) can't break CI or a release by
      # itself; bump deliberately, together with the local toolchain.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install app dependencies
        run: npm ci
        working-directory: apps/desktop

      # macOS signing and notarization. An unset secret still arrives as an empty variable, and
      # the bundler then tries to import an empty certificate and fails, so only secrets that have a
      # value are exported. With none set, the build is ad-hoc signed ("-" in tauri.conf.json) and
      # not notarized: it runs, but macOS asks the user to approve it on first launch.
      - name: Export Apple signing secrets that are set
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__LEDGERLENS_EOF__"; echo "$value"; echo "__LEDGERLENS_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Ledgerlens ${{ github.ref_name }}
          releaseBody: |
            Early preview. Pick the file for your computer:
            - Mac: the .dmg (aarch64 = Apple silicon, x64 = Intel). macOS 13 or later.
            - Windows: the -setup.exe (or the .msi). Windows 10 or 11, 64-bit.
            - Linux: the .AppImage, .deb, or .rpm (64-bit; Ubuntu 22.04, Debian 12, Fedora 36, or newer).

            These builds aren't notarized or code-signed yet, so macOS and Windows warn on first launch; the README says how to open them. Reading photos and scans (OCR) and folder watching are Mac only; on Windows and Linux, PDFs with text are read and photos are entered by hand.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
