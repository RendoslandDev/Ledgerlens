# Builds signed desktop installers when a version tag (v1.2.3) is pushed, and attaches them to a
# draft GitHub Release. See docs/deploy.md for the signing secrets this expects.
name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Windows and Linux are not in the first release: neither build has been launched and
          # checked yet. Uncomment after a CI run produces installers that open and import a PDF.
          # - platform: windows-latest
          #   args: ""
          # - platform: ubuntu-22.04
          #   args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install app dependencies
        run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization. Without these secrets the build is ad-hoc signed and not
          # notarized: it runs, but macOS asks the user to approve it on first launch.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Unset secrets arrive as empty strings; fall back to ad-hoc signing ("-") explicitly.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Ledgerlens ${{ github.ref_name }}
          releaseBody: Early preview for macOS. Download the .dmg for your Mac (aarch64 = Apple silicon, x64 = Intel). If the build isn't notarized, macOS will block the first launch; see the README for how to open it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
