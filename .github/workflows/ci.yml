# Tests every push on macOS, Windows, and Linux, builds the Windows and Linux installers, and
# smoke-tests them: Windows end to end over the app's IPC, Linux by launching the installed app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Pinned so a new stable release (and its new clippy lints) can't break CI or a release by
      # itself; bump deliberately, together with the local toolchain.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      # The Tauri crate embeds the built frontend, so build it before any cargo command there.
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Core tests
        run: .github/scripts/annotate.sh "Core tests" cargo test --workspace --locked

      - name: Core lints
        run: .github/scripts/annotate.sh "Core lints" cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: App tests (includes the bindings drift check)
        working-directory: apps/desktop/src-tauri
        run: ../../../.github/scripts/annotate.sh "App tests" cargo test --locked

      - name: App lints
        working-directory: apps/desktop/src-tauri
        run: ../../../.github/scripts/annotate.sh "App lints" cargo clippy --all-targets --locked -- -D warnings

      - name: Build installers
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: ../../.github/scripts/annotate.sh "Build installers" npx tauri build

      - name: Smoke test (Windows, installed app over IPC)
        if: runner.os == 'Windows'
        run: .github/scripts/annotate.sh "Windows smoke test" pwsh -NoProfile -File .github/scripts/smoke-windows.ps1

      - name: Smoke test (Linux, installed .deb launches)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          sudo apt-get install -y "./$deb"
          bin=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep '^/usr/bin/' | head -1)
          echo "launching $bin"
          xvfb-run -a "$bin" > app.log 2>&1 &
          for i in $(seq 1 30); do
            [ -f "$HOME/.local/share/com.ledgerlens.app/ledgerlens.db" ] && break
            sleep 1
          done
          sleep 5
          if ! pgrep -f "$bin" > /dev/null; then echo "the app exited"; cat app.log; exit 1; fi
          ls -la "$HOME/.local/share/com.ledgerlens.app"
          test -f "$HOME/.local/share/com.ledgerlens.app/ledgerlens.db"
          pkill -f "$bin"
          echo "smoke test passed"

      - name: Upload installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
